name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 28.1
      - run: mix deps.get
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - name: Verify tag version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(mix run --no-compile --no-start -e 'IO.write(Mix.Project.config()[:version])')"
      - run: mix test
      - run: MIX_ENV=docs mix deps.get
      - run: MIX_ENV=docs mix docs --warnings-as-errors
      - run: mix hex.build
      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
